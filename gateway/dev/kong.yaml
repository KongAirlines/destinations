_format_version: "3.0"
_info:
  select_tags:
  - scope-destinations-dev
services:
- host: api.kong-air.com
  id: e4431b3f-ca93-5216-810d-d03e1ed55a29
  name: destinations-dev
  path: /
  plugins: []
  port: 443
  protocol: https
  routes:
  - id: 6e8c1bcd-88d4-5228-a060-127ccbcc45df
    methods:
    - GET
    name: destinations-dev_getalldestinations
    paths:
    - ~/destinations$
    plugins: []
    regex_priority: 200
    strip_path: false
    tags:
    - env-dev
    - team-flight-data
    - owner-destinations
    - scope-destinations-dev
  - id: dca7dcf9-589a-51cc-9a0e-4ef9290c15fc
    methods:
    - GET
    name: destinations-dev_getdestinationbyid
    paths:
    - ~/destinations/(?<id>[^#?/]+)$
    plugins: []
    regex_priority: 100
    strip_path: false
    tags:
    - env-dev
    - team-flight-data
    - owner-destinations
    - scope-destinations-dev
  - id: 0e13c92d-7ae8-55a2-932b-154bd41a8b91
    methods:
    - GET
    name: destinations-dev_gethealthstatus
    paths:
    - ~/destinations/health$
    plugins: []
    regex_priority: 200
    strip_path: false
    tags:
    - env-dev
    - team-flight-data
    - owner-destinations
    - scope-destinations-dev
  tags:
  - env-dev
  - team-flight-data
  - owner-destinations
  - scope-destinations-dev
upstreams: []
